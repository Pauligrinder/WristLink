name: Release

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  SFOS_RELEASE: "5.2.0.15"

jobs:
  prepare:
    name: Decide release
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.decide.outputs.should_release }}
      version: ${{ steps.decide.outputs.version }}
      release: ${{ steps.decide.outputs.release }}
      tag: ${{ steps.decide.outputs.tag }}
      watch_version: ${{ steps.decide.outputs.watch_version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Decide whether to publish a release
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="$(sed -n 's/^VERSION *= *//p' app/harbour-wristlink.pro | head -1 | tr -d '[:space:]')"
          WATCH_VERSION="$(sed -n 's/.*versionName *"\([^"]*\)".*/\1/p' watch/app/build.gradle | head -1)"
          RELEASE=1
          TAG="v${VERSION}"
          SHOULD=false

          if [ "${{ github.ref_type }}" = "tag" ]; then
            RAW="${GITHUB_REF_NAME#v}"
            # Accept v0.1.9 or v0.1.9-2
            if [[ "$RAW" =~ ^([0-9]+(\.[0-9]+)*)(-([0-9]+))?$ ]]; then
              VERSION="${BASH_REMATCH[1]}"
              if [ -n "${BASH_REMATCH[4]:-}" ]; then
                RELEASE="${BASH_REMATCH[4]}"
              fi
              TAG="v${VERSION}"
              if [ "$RELEASE" != "1" ]; then
                TAG="v${VERSION}-${RELEASE}"
              fi
            else
              echo "::error::Tag '${GITHUB_REF_NAME}' must look like v0.1.9 or v0.1.9-2"
              exit 1
            fi
            PRO_VERSION="$(sed -n 's/^VERSION *= *//p' app/harbour-wristlink.pro | head -1 | tr -d '[:space:]')"
            if [ "$VERSION" != "$PRO_VERSION" ]; then
              echo "::error::Tag version ${VERSION} does not match .pro VERSION ${PRO_VERSION}"
              exit 1
            fi
            SHOULD=true
          elif [ "${{ github.ref_name }}" = "main" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            # Match v0.2.4 as well as rebuilds like v0.2.4-2, otherwise
            # replacing a release with a higher build number would make the
            # next merge republish the same version as -1.
            VERSION_RE="$(printf '%s' "$VERSION" | sed 's/\./\\./g')"
            EXISTING="$(gh release list --repo "${{ github.repository }}" --limit 200 \
              --json tagName --jq '.[].tagName' \
              | grep -E "^v${VERSION_RE}(-[0-9]+)?\$" | head -1 || true)"
            if [ -n "$EXISTING" ]; then
              echo "Release ${EXISTING} already covers version ${VERSION} — skipping publish."
              SHOULD=false
            else
              echo "No GitHub release for version ${VERSION} yet — will build and publish."
              SHOULD=true
            fi
          fi

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "release=${RELEASE}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "watch_version=${WATCH_VERSION}" >> "$GITHUB_OUTPUT"
          echo "should_release=${SHOULD}" >> "$GITHUB_OUTPUT"
          echo "Decision: should_release=${SHOULD} tag=${TAG} version=${VERSION} release=${RELEASE} watch=${WATCH_VERSION}"

  phone:
    name: Phone (${{ matrix.arch }})
    needs: prepare
    if: needs.prepare.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        arch: [aarch64, armv7hl, i486]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build RPM
        env:
          SFOS_RELEASE: ${{ env.SFOS_RELEASE }}
        run: |
          chmod +x scripts/ci-build.sh
          ./scripts/ci-build.sh "${{ matrix.arch }}" \
            "${{ needs.prepare.outputs.version }}" \
            "${{ needs.prepare.outputs.release }}"

      - name: Upload RPM artifact
        uses: actions/upload-artifact@v4
        with:
          name: rpm-${{ matrix.arch }}
          path: |
            RPMS/*.rpm
            !RPMS/*-debuginfo-*.rpm
            !RPMS/*-debugsource-*.rpm
          if-no-files-found: error
          retention-days: 30

  watch:
    name: Watch APK
    needs: prepare
    if: needs.prepare.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install Android build packages
        run: |
          sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Build debug APK
        working-directory: watch
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Name the APK
        run: |
          mkdir -p release-apk
          cp watch/app/build/outputs/apk/debug/app-debug.apk \
            "release-apk/wristlink-watch-${{ needs.prepare.outputs.watch_version }}.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk-watch
          path: release-apk/*.apk
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish GitHub Release
    needs: [prepare, phone, watch]
    if: needs.prepare.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Download RPMs
        uses: actions/download-artifact@v4
        with:
          pattern: rpm-*
          path: release-files
          merge-multiple: true

      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: apk-watch
          path: release-files

      - name: List artifacts
        run: find release-files -type f \( -name '*.rpm' -o -name '*.apk' \) -exec ls -lh {} \;

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: WristLink ${{ needs.prepare.outputs.version }}
          body: |
            Sailfish phone package ${{ needs.prepare.outputs.version }} and Wear OS watch app ${{ needs.prepare.outputs.watch_version }}.

            Install the RPM on the phone and the APK on the watch together. Pair the watch in Sailfish Bluetooth, open WristLink on the watch, and leave it running.
          generate_release_notes: true
          files: |
            release-files/**/*.rpm
            release-files/**/*.apk
          fail_on_unmatched_files: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
